name: Docs

on:
  push:
    branches: [main]

# Least privilege by default: only the deploy job below is allowed to write to
# Pages or mint an OIDC token. The build job compiles TypeDoc output from a
# checkout and needs nothing beyond reading the repo (plus the Pages settings
# that configure-pages looks up).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung step must fail fast and say which one it was: the account gets 20
    # concurrent Actions slots, and a wedged job holds one of them for six
    # hours by default while everyone else queues behind it.
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build API docs (TypeDoc)
        run: npm run docs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          # Scope the artifact name per run-attempt. A re-run's
          # upload-pages-artifact does not remove the previous attempt's
          # artifact, so a shared "github-pages" name leaves deploy-pages with
          # two identically-named artifacts and it fails. A per-attempt name
          # keeps each attempt's artifact isolated.
          name: github-pages-${{ github.run_attempt }}
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job in the repo that may publish to Pages, and the only one
    # holding an OIDC token — deploy-pages needs both; nothing else does.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
