name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Cheap gate in front of everything else. `npm run typecheck` is ~2s, and a
  # type error fails every one of the eleven jobs below in exactly the same
  # way — so pay for one runner to learn that, not eleven.
  lint:
    runs-on: ubuntu-latest
    # A hung step must fail fast and say which one it was: the account gets 20
    # concurrent Actions slots, and a wedged job holds one of them for six
    # hours by default while everyone else queues behind it.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24 (current LTS)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

  # Second gate: a tsup/exports config that cannot even produce a bundle makes
  # the smoke jobs meaningless, so prove the build once before the fan-out.
  # The only build in this pipeline. It uploads dist/ because that is the only
  # way to hand files to another job -- each job runs on a fresh VM, so a dist/
  # left on disk here would simply be thrown away. Every runtime smoke below
  # then imports this one artifact, which is the point: they must all exercise
  # the same bundle, the one that would be published.
  build:
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24 (current LTS)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build (ESM + CJS + IIFE + types)
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  build-test:
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Every Node line that is still supported plus the current release:
        #   20 = Iron   (EOL, still allowed by `engines: node >=20`)
        #   22 = Jod    (LTS)
        #   24 = Krypton(LTS)
        #   26 = Current
        node-version: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (ESM + CJS + IIFE + types)
        run: npm run build

  # Two constants decide how every 64-bit value is read and written -- `LO` and
  # `HI` in `src/varint/bits64.ts`, the index of each 32-bit half in host byte
  # order, probed once at load. On every machine this project has run on they come
  # back 0 and 1; the other answer, 1 and 0, is what a big-endian host gives, and
  # no runner here produces it. A port with the two swapped would be green on
  # every job above and return garbage on s390x -- and the surface is growing,
  # since the 64-bit array destinations fill through a `Uint32Array` over the
  # caller's own buffer and index it with exactly these two.
  #
  # So the suite runs once more, on an emulated big-endian machine. Measured at
  # under two minutes end to end, which is why it sits here with the rest rather
  # than on a nightly schedule.
  #
  # There is no container, and that is not a preference: the official `node` image
  # publishes amd64, arm64 and ppc64le, and ppc64le is little-endian -- there is
  # no s390x tag to run. So the runner emulates directly, with qemu-user, the
  # s390x runtime from Ubuntu ports, and Node's own s390x build.
  big-endian:
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24 (current LTS)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install the emulator and the s390x runtime
        run: |
          set -euo pipefail
          . /etc/os-release
          # The existing sources carry no s390x; pinning them to amd64 keeps apt
          # from looking for it there, and ports.ubuntu.com is where it lives.
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Suites:/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          else
            sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          fi
          sudo dpkg --add-architecture s390x
          sudo tee /etc/apt/sources.list.d/s390x-ports.sources >/dev/null <<EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: ${VERSION_CODENAME} ${VERSION_CODENAME}-updates
          Components: main universe
          Architectures: s390x
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          for attempt in 1 2 3; do sudo apt-get update -qq && break || sleep 10; done
          sudo apt-get install -y -qq qemu-user libc6:s390x libstdc++6:s390x

      - name: Fetch Node's own s390x build
        run: |
          set -euo pipefail
          # The same version this job already uses, so the emulated half is not
          # quietly testing a different engine.
          ver=$(node -v)
          curl -fsSL --retry 3 --retry-delay 5 \
            -o /tmp/node-s390x.tar.xz \
            "https://nodejs.org/dist/${ver}/node-${ver}-linux-s390x.tar.xz"
          mkdir -p /tmp/node-s390x
          tar xf /tmp/node-s390x.tar.xz -C /tmp/node-s390x --strip-components=1
          echo "NODE_S390X=/tmp/node-s390x/bin/node" >> "$GITHUB_ENV"

      # The guard that makes the rest of this job mean something. If the emulation
      # silently did not take, everything below would pass while proving nothing.
      - name: Prove the machine really is big-endian
        run: |
          set -euo pipefail
          got=$(qemu-s390x -L / "$NODE_S390X" \
            -e 'process.stdout.write(process.arch + " " + require("os").endianness())')
          echo "reported: $got"
          [ "$got" = "s390x BE" ] || {
            echo "::error::expected 's390x BE', got '$got' -- the emulation did not take"
            exit 1
          }

      - name: Install dependencies (natively) plus the s390x esbuild
        run: |
          set -euo pipefail
          npm ci
          # vitest transforms TypeScript with esbuild, which is a native binary:
          # the emulated run needs the s390x one, at exactly the version the tree
          # already resolved, or esbuild refuses to start. `--force` because npm
          # will not install a package for a foreign platform otherwise.
          esbuild_version=$(node -p "require('esbuild/package.json').version")
          npm i --no-save --force --cpu=s390x --os=linux \
            "@esbuild/linux-s390x@${esbuild_version}"

      - name: Test
        run: |
          set -euo pipefail
          # `--pool=threads` -- the default pool forks a worker per file, and
          # qemu-user does not carry the emulation into a spawned child unless
          # binfmt_misc is registered. Threads keep the run in one process.
          #
          # `--testTimeout` -- the suite's own limit is 20s, and a slower machine
          # puts several cases past it: the destination-shape differential needs
          # ~50s emulated and `long-scalar.test.ts` 32s. Both pass once allowed to
          # finish, which is the point -- this job reports on byte order, not on
          # emulation speed.
          #
          # Three files sit out, none of them about byte order:
          #   bench-*        shell out to the bench tools and measure throughput
          #                  -- the 1 MB blob row alone takes over four minutes
          #                  emulated, against a limit the file sets itself;
          #   public-surface reads the sources and package.json to check the
          #                  export surface, and trips a vitest/esbuild bug on
          #                  s390x before it collects a single test
          #                  ("Bad escaped character in JSON"). Reproducible in
          #                  isolation, nothing to do with this codebase.
          qemu-s390x -L / "$NODE_S390X" node_modules/vitest/vitest.mjs run \
            --pool=threads \
            --testTimeout=300000 \
            --exclude "test/bench-*.test.ts" \
            --exclude "test/public-surface.test.ts"

  # Smoke-test the *built* bundles. This is the only place dist/ is exercised —
  # the vitest suite above covers src/ — so it is what stands between a broken
  # tsup/exports config and a broken publish.
  #
  # Two axes matter, and they are not equally valuable:
  #
  #   * ARTIFACT (high value): package.json ships ESM + CJS + IIFE and resolves
  #     them through an `exports` map. Each is a separate way for a build config
  #     change to break consumers, and nothing else in CI looks at them.
  #   * RUNTIME VERSION (low value): the bundle is dependency-free standard JS.
  #     Whether Bun 1.1 or 1.3 loads it is near-zero risk, so we test the
  #     boundaries (oldest Node that `engines` promises, newest Node) and the
  #     current stable Deno/Bun rather than a broad version fan-out.
  #
  # Note that Node+Deno+Bun canNOT prove the bundle is runtime-agnostic: Deno 2
  # and Bun implement the `node:` builtins and most Node globals deliberately,
  # so an accidental `process`/`Buffer` dependency would pass on all three. The
  # runtime that would catch it is the browser — covered by smoke-browser.mjs,
  # which loads the IIFE with no Node globals in scope.
  #
  # The bundle is built once here and handed to the smoke jobs as an artifact,
  # so those jobs need no npm install at all — they only ever see what a
  # consumer would see.
  smoke-node:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The boundaries of what `engines: node >=20` promises: the oldest
        # supported line and the current release. The lines in between are
        # already covered by the full vitest suite in build-test.
        node-version: [20, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Smoke test ESM bundle + exports map
        run: node test/smoke.mjs
      - name: Smoke test CJS bundle + exports map
        run: node test/smoke.cjs
      - name: Smoke test IIFE bundle without Node globals
        run: node test/smoke-browser.mjs

  smoke-deno:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Smoke test ESM bundle on Deno
        run: deno run --allow-read test/smoke.mjs

  smoke-bun:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Smoke test ESM bundle on Bun
        run: bun ./test/smoke.mjs
      - name: Smoke test CJS bundle on Bun
        run: bun ./test/smoke.cjs

  coverage:
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Coverage
        run: npm run coverage

      - name: Compute badge JSON from lcov
        run: |
          mkdir -p "$RUNNER_TEMP/badges"
          awk -F: '
            /^LF:/ { lf += $2 } /^LH:/ { lh += $2 }
            /^BRF:/ { brf += $2 } /^BRH:/ { brh += $2 }
            END {
              lines    = (lf  > 0) ? lh  / lf  * 100 : 0
              branches = (brf > 0) ? brh / brf * 100 : 0
              printf "%.1f %.1f\n", lines, branches
            }' coverage/lcov.info > "$RUNNER_TEMP/pct.txt"
          read LINES BRANCHES < "$RUNNER_TEMP/pct.txt"
          color() {
            awk -v v="$1" 'BEGIN { print (v+0 >= 90) ? "brightgreen" : (v+0 >= 75) ? "yellow" : "red" }'
          }
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
            "$LINES" "$(color "$LINES")" > "$RUNNER_TEMP/badges/coverage.json"
          printf '{"schemaVersion":1,"label":"branches","message":"%s%%","color":"%s"}\n' \
            "$BRANCHES" "$(color "$BRANCHES")" > "$RUNNER_TEMP/badges/branches.json"
          echo "coverage=$LINES% branches=$BRANCHES%"

      - name: Publish badges to the badges branch
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan badges
          git reset --hard
          cp "$RUNNER_TEMP/badges/coverage.json" "$RUNNER_TEMP/badges/branches.json" .
          git add coverage.json branches.json
          git commit -m "ci: update coverage badges"
          git push -f origin badges
