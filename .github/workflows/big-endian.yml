# Two constants decide how every 64-bit value is read and written -- `LO` and
# `HI` in `src/varint/bits64.ts`, the index of each 32-bit half in host byte
# order. They are probed once at load, and on every machine this project has
# ever run on they come back 0 and 1. The other answer, 1 and 0, is what a
# big-endian host gives, and nothing in CI produces it: a port that had the two
# swapped would be green on every runner and return garbage on s390x. The
# 64-bit array destinations fill through a `Uint32Array` over the caller's own
# buffer and index it with exactly these two, so the surface is growing.
#
# So the suite runs once a night on an emulated big-endian machine. Not per PR:
# emulation is ~20x slower, and the code this covers changes rarely.
#
# There is no container here, and that is not a preference: the official `node`
# image publishes amd64, arm64 and ppc64le, and ppc64le is little-endian -- there
# is no s390x tag to run. So the runner emulates directly, with qemu-user, the
# s390x runtime libraries from Ubuntu ports, and Node's own s390x build.
name: Big-endian

on:
  # A PR that touches byte-order-sensitive code -- or this job -- gets it too,
  # because that is when the answer is actually in question.
  pull_request:
    paths:
      - 'src/varint/bits64.ts'
      - 'src/varint/num64.ts'
      - 'src/long.ts'
      - 'src/decode/state.ts'
      - 'src/backend/js.ts'
      - '.github/workflows/big-endian.yml'
  schedule:
    - cron: '35 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  s390x:
    name: Full suite on s390x (emulated)
    runs-on: ubuntu-latest
    # Measured end to end: ~7 minutes for the suite itself at roughly 20x native,
    # plus a couple for the setup. Thirty leaves room for a slow runner without
    # letting a wedged job hold an Actions slot for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24 (current LTS)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install the emulator and the s390x runtime
        run: |
          set -euo pipefail
          . /etc/os-release
          # The existing sources carry no s390x; pinning them to amd64 keeps apt
          # from looking for it there, and ports.ubuntu.com is where it lives.
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Suites:/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          else
            sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          fi
          sudo dpkg --add-architecture s390x
          sudo tee /etc/apt/sources.list.d/s390x-ports.sources >/dev/null <<EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: ${VERSION_CODENAME} ${VERSION_CODENAME}-updates
          Components: main universe
          Architectures: s390x
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          for attempt in 1 2 3; do sudo apt-get update -qq && break || sleep 10; done
          sudo apt-get install -y -qq qemu-user libc6:s390x libstdc++6:s390x

      - name: Fetch Node's own s390x build
        run: |
          set -euo pipefail
          # The same version the runner uses, so the emulated half of this job is
          # not quietly testing a different engine.
          ver=$(node -v)
          curl -fsSL --retry 3 --retry-delay 5 \
            -o /tmp/node-s390x.tar.xz \
            "https://nodejs.org/dist/${ver}/node-${ver}-linux-s390x.tar.xz"
          mkdir -p /tmp/node-s390x
          tar xf /tmp/node-s390x.tar.xz -C /tmp/node-s390x --strip-components=1
          echo "NODE_S390X=/tmp/node-s390x/bin/node" >> "$GITHUB_ENV"

      # The guard that makes the rest of this job mean something. If the emulation
      # silently did not take, everything below would pass while proving nothing.
      - name: Prove the machine really is big-endian
        run: |
          set -euo pipefail
          got=$(qemu-s390x -L / "$NODE_S390X" \
            -e 'process.stdout.write(process.arch + " " + require("os").endianness())')
          echo "reported: $got"
          [ "$got" = "s390x BE" ] || {
            echo "::error::expected 's390x BE', got '$got' -- the emulation did not take"
            exit 1
          }

      - name: Install dependencies (natively) plus the s390x esbuild
        run: |
          set -euo pipefail
          npm ci
          # vitest transforms TypeScript with esbuild, which is a native binary:
          # the emulated run needs the s390x one, at exactly the version the tree
          # already resolved, or esbuild refuses to start. `--force` because npm
          # will not install a package for a foreign platform otherwise.
          esbuild_version=$(node -p "require('esbuild/package.json').version")
          npm i --no-save --force --cpu=s390x --os=linux \
            "@esbuild/linux-s390x@${esbuild_version}"

      - name: Full suite
        run: |
          set -euo pipefail
          # `--pool=threads` -- the default pool forks a worker per file, and
          # qemu-user does not carry the emulation into a spawned child unless
          # binfmt_misc is registered. Threads keep the run in one process.
          #
          # `--testTimeout` -- the suite's own limit is 20s, and a ~20x slower
          # machine puts several cases past it: the destination-shape differential
          # needs ~50s there and `long-scalar.test.ts` 32s. Both pass once allowed
          # to finish, which is the point -- this job should report on byte order,
          # not on emulation speed.
          #
          # Three files sit out, none of them about byte order:
          #   bench-*        shell out to the bench tools and measure throughput
          #                  -- the 1 MB blob row alone takes over four minutes
          #                  emulated, against a limit the file sets itself;
          #   public-surface reads the sources and package.json to check the
          #                  export surface, and trips a vitest/esbuild bug on
          #                  s390x before it collects a single test
          #                  ("Bad escaped character in JSON"). Reproducible in
          #                  isolation, nothing to do with this codebase.
          qemu-s390x -L / "$NODE_S390X" node_modules/vitest/vitest.mjs run \
            --pool=threads \
            --testTimeout=300000 \
            --exclude "test/bench-*.test.ts" \
            --exclude "test/public-surface.test.ts"
